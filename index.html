<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pinnacle AI — your CBSE board buddy. A 24/7 AI teacher trained on NCERT, exemplar and CBSE marking schemes, for classes 9 to 12." />
    <meta name="theme-color" content="#050505" />
    <!-- The same gold peak as components/Logo.tsx and the landing header. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 22'%3E%3Cpath d='M13 1.6 L25 20.6 H16.6 L13 14.6 L9.4 20.6 H1 Z' fill='%23E8C889'/%3E%3Cpath d='M13 1.6 L16.9 7.8 L13 9.9 L9.1 7.8 Z' fill='%23050505' fill-opacity='0.35'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- One type system for the landing and the product: Hanken Grotesk for
         everything set in words, JetBrains Mono for every label, number and
         marks chip. Loaded here rather than per-page so the front door has no
         flash of fallback type. Preloaded as non-blocking (rel=preload +
         onload swap) so first paint doesn't wait on fonts.googleapis.com. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" /></noscript>
    <title>Pinnacle AI — Your CBSE Board Buddy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
