<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Pinnacle</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-style='italic' font-size='21' fill='%23ebfb1d' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0a0a0a; --panel:#131313; --ink:#c5b6af; --accent:#ebfb1d;
    --dim:rgba(197,182,175,.58); --faint:rgba(197,182,175,.34);
    --line:rgba(197,182,175,.1); --line2:rgba(197,182,175,.2);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink)}
  body{font-family:var(--mono);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;
       display:flex;flex-direction:column;overflow:hidden}
  ::selection{background:var(--accent);color:#000}

  header{flex:none;display:flex;align-items:center;gap:14px;padding:14px 20px;
         border-bottom:1px solid var(--line);background:rgba(0,0,0,.86);backdrop-filter:blur(14px)}
  .logo{font-style:italic;font-family:Georgia,serif;color:var(--accent);font-size:16px}
  .who{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
  header .sp{flex:1}
  .stat{font-size:10.5px;color:var(--faint);white-space:nowrap}
  .stat b{color:var(--dim);font-weight:400}
  a.back{color:var(--faint);text-decoration:none;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
  a.back:hover{color:var(--accent)}

  main{flex:1;overflow-y:auto;overflow-x:hidden;padding:26px 20px 8px;scroll-behavior:smooth}
  .thread{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
  .turn{display:flex;flex-direction:column;gap:6px;animation:rise .28s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .turn .lab{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
  .turn.me .lab{color:var(--faint)}
  .turn.her .lab{color:var(--accent)}
  .turn p{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.02em;
          font-size:16.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
  .turn.me p{color:var(--dim)}
  .turn.her p{color:var(--ink)}
  .turn .ms{font-size:9.5px;color:var(--faint)}
  .caret::after{content:"";display:inline-block;width:7px;height:16px;background:var(--accent);
                margin-left:3px;vertical-align:-2px;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .day{text-align:center;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);
       padding:6px 0;border-top:1px solid var(--line)}

  footer{flex:none;border-top:1px solid var(--line);padding:14px 20px calc(14px + env(safe-area-inset-bottom));
         background:rgba(0,0,0,.9)}
  .bar{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
  input{flex:1;background:transparent;border:1px solid var(--line2);border-radius:9px;color:var(--ink);
        font-family:inherit;font-size:14px;padding:12px 14px;outline:none;min-width:0}
  input:focus{border-color:var(--dim)}
  input::placeholder{color:var(--faint)}
  button{flex:none;border:1px solid var(--line2);background:transparent;color:var(--ink);font-family:inherit;
         font-size:12px;border-radius:9px;padding:12px 15px;cursor:pointer;transition:.16s;white-space:nowrap}
  button:hover{border-color:var(--dim)}
  #mic.on{background:var(--accent);color:#000;border-color:var(--accent)}
  #mic.hot{animation:hot 1.1s infinite}
  @keyframes hot{50%{box-shadow:0 0 0 5px rgba(235,251,29,.16)}}
  .hint{max-width:720px;margin:9px auto 0;font-size:10px;color:var(--faint);min-height:13px}
  .hint b{color:var(--dim);font-weight:400}

  @media(max-width:620px){
    header{padding:12px 14px;gap:10px} .who{display:none}
    main{padding:18px 14px 6px} .turn p{font-size:17px} footer{padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
  }
</style>
</head>
<body>

<header>
  <span class="logo">P</span>
  <span class="who">Pinnacle</span>
  <span class="sp"></span>
  <span class="stat" id="stat"></span>
  <a class="back" href="/">Office</a>
</header>

<main id="main"><div class="thread" id="thread"></div></main>

<footer>
  <div class="bar">
    <input id="in" autocomplete="off" placeholder="Say something." autofocus>
    <button id="mic" title="Hold a conversation out loud">Talk</button>
    <button id="send">Send</button>
  </div>
  <div class="hint" id="hint"></div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const thread = $("thread"), main = $("main");
let busy = false, speakOn = true;

const scroll = () => { main.scrollTop = main.scrollHeight; };
const hint = (h) => { $("hint").innerHTML = h || ""; };

function turn(who, text = "") {
  const el = document.createElement("div");
  el.className = "turn " + (who === "ayaan" ? "me" : "her");
  el.innerHTML = `<span class="lab">${who === "ayaan" ? "You" : "Pinnacle"}</span><p></p>`;
  el.querySelector("p").textContent = text;
  thread.appendChild(el);
  scroll();
  return el.querySelector("p");
}

function stamp(label) {
  const el = document.createElement("div");
  el.className = "day";
  el.textContent = label;
  thread.appendChild(el);
}

// ------------------------------------------------------------------ her voice

// Free, and it stays free. The browser's own neural voices cost nothing, need
// no key and no account, and nothing said here leaves the machine. The server
// answers /api/say with 204 unless a paid engine is deliberately configured,
// and none is, so this is the path every time.
let voice = null;
function pickVoice() {
  const all = speechSynthesis.getVoices();
  if (!all.length) return;
  const en = all.filter((v) => /^en/i.test(v.lang));
  voice =
    en.find((v) => /Natural/i.test(v.name) && /Female|Aria|Jenny|Sonia|Libby|Emily/i.test(v.name)) ||
    en.find((v) => /Natural|Online/i.test(v.name)) ||
    en.find((v) => /Zira|Hazel|Samantha/i.test(v.name)) ||
    en[0] || all[0];
}
pickVoice();
speechSynthesis.onvoiceschanged = pickVoice;

// She speaks a sentence at a time, as they arrive, rather than waiting for the
// whole reply. That is the difference between hearing her at two seconds and
// hearing her when she has finished thinking.
let spoken = 0;
function speakMore(full, force = false) {
  if (!speakOn) return;
  const pending = full.slice(spoken);
  const cut = force ? pending.length : Math.max(pending.lastIndexOf("."), pending.lastIndexOf("?"), pending.lastIndexOf("!"), pending.lastIndexOf("\n")) + 1;
  if (cut <= 0) return;
  const chunk = pending.slice(0, cut).trim();
  spoken += cut;
  if (!chunk) return;
  const u = new SpeechSynthesisUtterance(chunk);
  if (voice) u.voice = voice;
  u.rate = 1.04; u.pitch = 1.0;
  // She must not talk over herself when he interrupts, and she must not keep
  // talking into an empty room after he has moved on.
  u.onend = () => { if (!speaking()) ear.resume(); };
  speechSynthesis.speak(u);
}
const speaking = () => speechSynthesis.speaking || speechSynthesis.pending;
const shutUp = () => { try { speechSynthesis.cancel(); } catch {} };

// -------------------------------------------------------------------- the wire

async function say(payload) {
  if (busy) return;
  busy = true;
  const p = turn("pinnacle");
  p.parentElement.classList.add("caret");
  let full = "", meta = null;
  spoken = 0;

  try {
    const r = await fetch("/api/talk", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!r.ok || !r.body) throw new Error("she is not answering (" + r.status + ")");

    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n\n")) !== -1) {
        const raw = buf.slice(0, nl).replace(/^data: /, "");
        buf = buf.slice(nl + 2);
        if (!raw.trim()) continue;
        let ev; try { ev = JSON.parse(raw); } catch { continue; }
        if (ev.type === "delta") { full += ev.text; p.textContent = full; speakMore(full); scroll(); }
        if (ev.type === "done") { meta = ev; full = ev.say || full; p.textContent = full; }
      }
    }
    speakMore(full, true);
  } catch (err) {
    p.textContent = String(err.message || err);
  }

  p.parentElement.classList.remove("caret");
  if (meta) {
    const tag = document.createElement("span");
    tag.className = "ms";
    tag.textContent = `${(meta.ms / 1000).toFixed(2)}s${meta.via && meta.via !== "instant" ? " · " + meta.via : " · instant"}`;
    p.parentElement.appendChild(tag);
    if (meta.degraded) hint("<b>" + meta.degraded + "</b>");
  }
  busy = false;
  scroll();
  if (!speaking()) ear.resume();
}

function send(text) {
  const said = String(text || "").trim();
  if (!said || busy) return;
  shutUp();
  turn("ayaan", said);
  $("in").value = "";
  say({ text: said });
}

$("send").onclick = () => send($("in").value);
$("in").onkeydown = (e) => { if (e.key === "Enter") send($("in").value); };

// --------------------------------------------------------------- her hearing

// The office page sends whatever is in the box the moment a recognition session
// ends. Sessions end on their own every few seconds, so a breath halfway
// through a sentence shipped it as a finished thought: his own log has her
// being asked "it's", "that's that's" and "Hey, ." and answering "didn't catch
// that" to all three.
//
// So nothing is sent when a session ends. Finalised words are banked, the
// session is restarted underneath him, and the question only goes when he has
// actually stopped talking for a beat.
const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;

const ear = (() => {
  if (!Rec) return { toggle: () => hint("This browser cannot hear. Use Edge or Chrome."), resume: () => {}, on: false };

  const rec = new Rec();
  rec.lang = "en-IN";
  rec.interimResults = true;
  rec.continuous = true;

  let on = false, live = false, banked = "", interim = "", timer = null, tries = 0;

  const SILENCE = 1100;   // how long a pause has to be before it counts as him finishing

  const settle = () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const said = (banked + " " + interim).trim();
      banked = ""; interim = "";
      // One stray syllable is not a question. Anything this short is the tail
      // of a cough or the room, and asking her about it wastes her and annoys him.
      if (said.replace(/[^a-z0-9]/gi, "").length < 2) { hint(""); return; }
      hint("");
      send(said);
    }, SILENCE);
  };

  rec.onresult = (e) => {
    interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) banked += r[0].transcript + " ";
      else interim += r[0].transcript;
    }
    const showing = (banked + interim).trim();
    if (showing) hint(`<b>${showing.slice(-90)}</b>`);
    // He is still going. Anything he says pushes the send back.
    settle();
  };

  rec.onstart = () => { live = true; tries = 0; };

  // A session ending is not him finishing. Restart underneath him and keep
  // whatever was banked, so a pause never truncates a sentence.
  rec.onend = () => {
    live = false;
    if (!on) return;
    setTimeout(start, Math.min(1200, 150 + tries * 200));
  };

  rec.onerror = (e) => {
    if (e.error === "no-speech" || e.error === "aborted") return;
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      on = false; paint();
      hint("Microphone blocked. Allow it from the padlock in the address bar.");
      return;
    }
    if (e.error === "network") hint("Speech recognition needs the network. Her voice does not.");
    tries++;
  };

  function start() {
    if (live || !on || document.hidden) return;
    // Never listen to herself. Recognition picking up her own voice is how a
    // conversation turns into a loop.
    if (speaking()) { setTimeout(start, 400); return; }
    try { rec.start(); live = true; } catch { live = false; }
  }

  function paint() {
    $("mic").classList.toggle("on", on);
    $("mic").textContent = on ? "Listening" : "Talk";
    if (!on) hint("");
  }

  // Speech recognition does not always prompt him for the microphone. It just
  // fails with not-allowed, silently, and the button looks broken. Asking for
  // the device directly is what makes the browser put the prompt up.
  async function allowed() {
    if (!navigator.mediaDevices?.getUserMedia) return true;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      stream.getTracks().forEach((t) => t.stop());   // never hold it open, it starves the recogniser
      return true;
    } catch { return false; }
  }

  return {
    get on() { return on; },
    async toggle() {
      if (!on && !(await allowed())) {
        hint("Microphone blocked. Click the padlock in the address bar, allow it, then press Talk again.");
        return;
      }
      on = !on;
      paint();
      if (on) { start(); hint("Go ahead. She waits for you to finish."); }
      else { try { rec.stop(); } catch {} clearTimeout(timer); banked = interim = ""; }
    },
    resume() { if (on) start(); },
  };
})();

$("mic").onclick = () => ear.toggle();
document.addEventListener("visibilitychange", () => { if (!document.hidden) ear.resume(); });

// ------------------------------------------------------------------ opening

(async function boot() {
  let s;
  try { s = await (await fetch("/api/talk")).json(); }
  catch { turn("pinnacle", "I can't reach my own office. Is the server still up?"); return; }

  $("stat").innerHTML = s.office.running ? "office <b>open</b>" : "office <b>shut</b>";

  for (const t of s.day.turns) turn(t.who, t.text);
  if (s.day.turns.length) stamp("today");

  // A new day, and she has not said anything yet. She goes first.
  if (s.greetingDue) say({ greeting: true });
  else if (!s.day.turns.length) hint("Say anything. She is not doing office work here.");

  $("in").focus();
})();
</script>
</body>
</html>
